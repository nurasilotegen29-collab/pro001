            { words: ['кесте', 'график', 'schedule', 'сағат'], response: "график" },
            { words: ['сертификат', 'certificate'], response: "сертификат" },
            { words: ['жұмыс', 'работа', 'job', 'орналасу', 'employment'], response: "жұмыс" },
            { words: ['мұғалім', 'преподаватель', 'teacher', 'ұстаз'], response: "мұғалім" },
            { words: ['жоба', 'проект', 'project', 'практика'], response: "жоба" },
            { words: ['бастаушы', 'начальный', 'beginner', 'нөлден'], response: "бастаушы" },
            { words: ['online', 'онлайн', 'дистанцион'], response: "online" }
        ];
        
        for (const kw of keywords) {
            for (const word of kw.words) {
                if (q.includes(word)) {
                    const responseKey = kw.response;
                    if (data.responses[responseKey]) {
                        return data.responses[responseKey];
                    }
                }
            }
        }
        
        // Стандартты жауап
        if (lang === 'kk') {
            return "💡 <strong>IT ACADEMY курстары:</strong>\n\n• 🐍 Python бағдарламалау\n• 🌐 Web Development (React, Node.js)\n• 📱 Mobile Development (Android, iOS)\n• 📊 Data Science және Machine Learning\n• 🤖 Жасанды интеллект (AI/ML)\n• ☕ Java, ⚙️ C++, 🎮 C#\n\n💰 Бағалар: 180 000 - 350 000 ₸ аралығында\n📅 Ұзақтығы: 3-6 ай\n\n🎁 АЛҒАШҚЫ САБАҚ ТЕГІН!\n\n📞 Толық ақпарат алу үшін нақты сұрақ қойыңыз немесе +7 (700) 000-0000 нөміріне қоңырау шалыңыз!";
        } else if (lang === 'ru') {
            return "💡 КУРСЫ IT ACADEMY:\n\n• Python, Web, Mobile, Data Science, AI/ML\n• Java, C++, C#\n• Цены: 180 000 - 350 000 ₸\n• Длительность: 3-6 месяцев\n\nПервый урок бесплатно!\nЗвоните: +7 (700) 000-0000";
        } else {
            return "💡 IT ACADEMY Courses:\n\n• Python, Web, Mobile, Data Science, AI/ML\n• Java, C++, C#\n• Prices: 180,000 - 350,000 ₸\n• Duration: 3-6 months\n\nFirst lesson free! Call: +7 (700) 000-0000";
        }
    }

    // ============ ТІЛДІ ӨЗГЕРТУ ============
    function setLanguage(lang) {
        currentLang = lang;
        const data = fullKnowledgeBase[lang];

        document.querySelectorAll('.lang-btn').forEach(btn => {
            btn.classList.toggle('active', btn.dataset.lang === lang);
        });

        userInput.placeholder = data.placeholder;
        statusText.textContent = data.statusReady;
        document.getElementById('welcome-message').innerHTML = data.welcome;

        const quickButtonsContainer = document.getElementById('quick-buttons');
        const quickQuestions = {
            kk: [
                { text: "🐍 Python курсы", question: "Python курсы туралы айтып беріңізші" },
                { text: "🌐 Web Development", question: "Web Development курсы қандай?" },
                { text: "📱 Mobile Development", question: "Mobile Development курсы бар ма?" },
                { text: "💰 Курс бағалары", question: "Курстардың бағасы қандай?" },
                { text: "🤖 AI курсы", question: "Жасанды интеллект курсы қандай?" },
                { text: "📝 Қалай жазылу?", question: "Қалай жазылуға болады?" },
                { text: "💼 Жұмыс", question: "Курстан кейін жұмыс табамын ба?" },
                { text: "📅 Кесте", question: "Сабақ кестесі қандай?" }
            ],
            ru: [
                { text: "🐍 Python курс", question: "Расскажите о курсе Python" },
                { text: "🌐 Web Development", question: "Что входит в Web Development?" },
                { text: "📱 Mobile", question: "Есть курсы по мобильной разработке?" },
                { text: "💰 Цены", question: "Сколько стоят курсы?" },
                { text: "🤖 AI курс", question: "Расскажите об AI курсе" },
                { text: "📝 Записаться", question: "Как записаться на курс?" }
            ],
            en: [
                { text: "🐍 Python", question: "Tell me about Python course" },
                { text: "🌐 Web Dev", question: "Tell me about Web Development" },
                { text: "📱 Mobile", question: "Tell me about Mobile Development" },
                { text: "💰 Prices", question: "What are the prices?" },
                { text: "🤖 AI course", question: "Tell me about AI course" },
                { text: "📝 Enroll", question: "How to enroll?" }
            ]
        };
        
        quickButtonsContainer.innerHTML = '';
        quickQuestions[lang].forEach(btn => {
            const b = document.createElement('button');
            b.className = 'quick-btn';
            b.textContent = btn.text;
            b.onclick = () => { 
                userInput.value = btn.question; 
                sendMessage(); 
            };
            quickButtonsContainer.appendChild(b);
        });
    }

    function addMessage(text, type) {
        const div = document.createElement('div');
        div.className = `msg ${type}`;
        div.innerHTML = type === 'bot' ? 
            `<i class="fas fa-robot" style="margin-right:8px"></i>${text.replace(/\n/g, '<br>')}` : 
            `<i class="fas fa-user" style="margin-right:8px"></i>${text.replace(/\n/g, '<br>')}`;
        chatScroller.appendChild(div);
        chatScroller.scrollTop = chatScroller.scrollHeight;
        return div;
    }

    function showTyping() {
        const t = document.createElement('div');
        t.className = 'typing-indicator';
        t.id = 'typing';
        t.innerHTML = '<span></span><span></span><span></span>';
        chatScroller.appendChild(t);
        chatScroller.scrollTop = chatScroller.scrollHeight;
    }

    function hideTyping() {
        const t = document.getElementById('typing');
        if (t) t.remove();
    }

    async function sendMessage() {
        const msg = userInput.value.trim();
        if (!msg) return;

        addMessage(msg, 'user');
        userInput.value = '';
        showTyping();

        const data = fullKnowledgeBase[currentLang];
        statusText.textContent = data.statusThinking;

        setTimeout(() => {
            const response = getSmartResponse(msg, currentLang);
            hideTyping();
            addMessage(response, 'bot');
            statusText.textContent = data.statusReady;
        }, 500);
    }

    // ============ МИКРОФОН (ДАУЫСТЫ ТАНУ) - РҰҚСАТ СҰРАЙДЫ ============
    function startVoiceRecognition() {
        // Браузерді тексеру
        if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
            addMessage("❌ Сіздің браузеріңіз дауысты тануды қолдамайды. 🎤 Google Chrome, Microsoft Edge немесе Safari қолданыңыз.", 'bot');
            return;
        }

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        recognition = new SpeechRecognition();
        
        const langMap = { kk: 'kk-KZ', ru: 'ru-RU', en: 'en-US' };
        recognition.lang = langMap[currentLang];
        recognition.continuous = false;
        recognition.interimResults = true;
        recognition.maxAlternatives = 1;

        const data = fullKnowledgeBase[currentLang];
        
        recognition.onstart = () => {
            isListening = true;
            voiceBtn.classList.add('listening');
            voiceBtn.innerHTML = '<i class="fas fa-microphone-slash"></i>';
            statusText.textContent = data.statusListening;
            statusDot.classList.add('recording');
            
            // Дауыс толқынын көрсету
            const voiceStatus = document.getElementById('voice-status');
            voiceStatus.innerHTML = '<span style="color:#ef4444">🔴 ЖАЗЫЛУДА...</span>';
        };

        recognition.onresult = (event) => {
            let finalTranscript = '';
            for (let i = event.resultIndex; i < event.results.length; i++) {
                if (event.results[i].isFinal) {
                    finalTranscript += event.results[i][0].transcript;
                }
            }
            
            if (finalTranscript) {
                userInput.value = finalTranscript;
                setTimeout(() => {
                    stopVoiceRecognition();
                    sendMessage();
                }, 300);
            }
        };

        recognition.onerror = (event) => {
            console.error('Speech recognition error:', event.error);
            let errorMsg = "";
            
            switch(event.error) {
                case 'not-allowed':
                    errorMsg = "❌ Микрофонға рұқсат беріңіз! 🔓 Браузердің жоғарғы сол жағындағы рұқсат батырмасын басыңыз.";
                    break;
                case 'no-speech':
                    errorMsg = "❌ Дауыс естілмеді. 🎤 Микрофонға жақындап, қайталаңыз.";
                    break;
                case 'audio-capture':
                    errorMsg = "❌ Микрофон табылмады. 🎧 Микрофонды қосып, бетті жаңартыңыз.";
                    break;
                case 'network':
                    errorMsg = "❌ Желі қатесі. Интернетіңізді тексеріңіз.";
                    break;
                default:
                    errorMsg = "❌ Дауысты тану мүмкін болмады. Қайталап көріңіз немесе мәтінмен жазыңыз.";
            }
            addMessage(errorMsg, 'bot');
            stopVoiceRecognition();
        };

        recognition.onend = () => {
            stopVoiceRecognition();
        };

        recognition.start();
    }

    function stopVoiceRecognition() {
        if (recognition) {
            try {
                recognition.stop();
            } catch(e) {}
            recognition = null;
        }
        isListening = false;
        voiceBtn.classList.remove('listening');
        voiceBtn.innerHTML = '<i class="fas fa-microphone"></i>';
        statusDot.classList.remove('recording');
        
        const data = fullKnowledgeBase[currentLang];
        statusText.textContent = data.statusReady;
        
        const voiceStatus = document.getElementById('voice-status');
        voiceStatus.innerHTML = '';
    }

    // Микрофон батырмасы
    voiceBtn.onclick = () => {
        if (isListening) {
            stopVoiceRecognition();
        } else {
            startVoiceRecognition();
        }
    };

    sendBtn.onclick = sendMessage;
    userInput.addEventListener('keypress', e => { if (e.key === 'Enter') sendMessage(); });

    document.querySelectorAll('.lang-btn').forEach(btn => {
        btn.onclick = () => {
            setLanguage(btn.dataset.lang);
            if (isListening) stopVoiceRecognition();
        };
    });

    // Бастапқы іске қосу
    setLanguage('kk');
    
    // Браузердің микрофон рұқсатын тексеру туралы хабарлама
    setTimeout(() => {
        addMessage("🎤 <strong>Микрофонды пайдалану үшін:</strong><br><br>1. Жоғарғы сол жақтағы 🔒 белгішесін басыңыз<br>2. Микрофонға рұқсат беріңіз<br>3. 🎤 батырмасын басып, сұрағыңызды айтыңыз", 'bot');
    }, 1000);
</script>
